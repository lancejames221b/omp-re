name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --ignore-scripts
      - run: bun run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --ignore-scripts
      # Deliberately no radare2 install and no test-fixture download here.
      # 5 suites (r2-pure, format, evidence, audit, report) run unconditionally
      # and must pass in full; 3 suites (r2-integration, tools-registry,
      # tools-mutate-registry) require both a real radare2 and a WannaCry
      # fixture that is deliberately not distributed with this repo, so they
      # `describe.skipIf(...)` themselves out — their tests report as skipped
      # inside the total (33 pass, 45 skip, 78 total), never a failure, exit
      # code 0. That is the correct, permanent shape of this job. See
      # docs/testing.md. Do not "fix" the skips by installing radare2 or
      # fetching a malware sample into CI.
      - run: bun test
